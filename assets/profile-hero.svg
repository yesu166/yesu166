<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
  <title id="title">Yesuraja — Applied AI &amp; Full-Stack Developer</title>
  <desc id="desc">A terminal-inspired profile banner featuring Yesuraja's original 55-line ASCII portrait from the Yesu-3D-Portfolio project.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ee7d5"/>
      <stop offset="0.55" stop-color="#82baff"/>
      <stop offset="1" stop-color="#c2a3ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a6c2d6" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { font-size: 11px; letter-spacing: 2px; }
      .muted { fill: #8d9baa; }
      .bright { fill: #eef4f7; }
      .mint { fill: #9be8d5; }
      .blue { fill: #96c5ff; }
      .ascii { font-family: "DejaVu Sans Mono", "Cascadia Mono", Consolas, monospace; font-size: 5.5px; font-weight: 600; text-anchor: middle; fill: url(#accent); white-space: pre; }
    </style>
  </defs>

