<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Yesuraja — Applied AI and Full-Stack Developer</title>
  <desc id="desc">A minimal dark terminal-inspired profile banner for Yesuraja, a second-year Computer Science and Engineering student specializing in AI and Machine Learning.</desc>
  <defs>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#8ee7d5"/>
      <stop offset="0.55" stop-color="#82baff"/>
      <stop offset="1" stop-color="#c2a3ff"/>
    </linearGradient>
    <pattern id="grid" width="24" height="24" patternUnits="userSpaceOnUse">
      <path d="M24 0H0V24" fill="none" stroke="#a6c2d6" stroke-opacity=".045" stroke-width="1"/>
    </pattern>
    <style>
      .mono { font-family: "SFMono-Regular", Consolas, "Liberation Mono", monospace; }
      .label { font-size: 11px; letter-spacing: 2px; }
      .muted { fill: #8d9baa; }
      .bright { fill: #eef4f7; }
      .mint { fill: #9be8d5; }
      .blue { fill: #96c5ff; }
    </style>
  </defs>

  <rect width="1200" height="350" rx="22" fill="#0b0f14"/>
  <rect width="1200" height="350" rx="22" fill="url(#grid)"/>
  <rect x="1" y="1" width="1198" height="348" rx="21" fill="none" stroke="#25313c"/>
  <rect x="28" y="28" width="4" height="294" rx="2" fill="url(#accent)"/>

  <text x="54" y="49" class="mono label mint">YESU166 / PERSONAL PROFILE</text>
  <rect x="930" y="29" width="216" height="32" rx="16" fill="#131b24" stroke="#2b3948"/>
  <text x="1038" y="49" text-anchor="middle" class="mono label bright" style="letter-spacing:1px">B.E. CSE · AI &amp; ML · YEAR 2</text>

  <text x="52" y="132" class="mono bright" font-size="66" font-weight="800" letter-spacing="-3">YESURAJA</text>
  <rect x="55" y="150" width="104" height="3" rx="1.5" fill="url(#accent)"/>

  <text x="54" y="190" class="mono" font-size="23" font-weight="600" fill="#dbe8ef">Applied AI &amp; Full-Stack Developer</text>
  <text x="54" y="222" class="mono" font-size="14" fill="#9aa9b6">Building practical software across models, interfaces, and systems.</text>

  <g class="mono" font-size="12">
    <text x="54" y="276" class="mint">PYTHON</text>
    <text x="126" y="276" class="muted">/</text>
    <text x="145" y="276" class="blue">TYPESCRIPT</text>
    <text x="244" y="276" class="muted">/</text>
    <text x="263" y="276" class="mint">REACT</text>
    <text x="322" y="276" class="muted">/</text>
    <text x="341" y="276" class="blue">FASTAPI</text>
    <text x="416" y="276" class="muted">/</text>
    <text x="435" y="276" fill="#c2a3ff">THREE.JS</text>
  </g>
  <text x="54" y="315" class="mono label muted" style="letter-spacing:1.4px">LEARN BY BUILDING · TEST THE REAL THING</text>

  <rect x="746" y="82" width="400" height="218" rx="13" fill="#101720" stroke="#2b3948"/>
  <path d="M746 120H1146" stroke="#2b3948"/>
  <circle cx="769" cy="101" r="4" fill="#f18a8a"/>
  <circle cx="783" cy="101" r="4" fill="#e8c57a"/>
  <circle cx="797" cy="101" r="4" fill="#8ee7d5"/>
  <text x="1126" y="105" text-anchor="end" class="mono label muted" style="letter-spacing:1.1px">SYSTEM LOOP / 001</text>

  <g class="mono">
    <text x="772" y="153" class="mint" font-size="15">&gt; observe()</text>
    <text x="925" y="153" class="muted" font-size="12">capture state</text>
    <text x="772" y="194" class="blue" font-size="15">&gt; act()</text>
    <text x="925" y="194" class="muted" font-size="12">bounded action</text>
    <text x="772" y="235" fill="#c2a3ff" font-size="15">&gt; verify()</text>
    <text x="925" y="235" class="muted" font-size="12">check evidence</text>
    <path d="M780 163V178M780 204V219" stroke="#475969" stroke-width="1.5" stroke-linecap="round"/>
    <path d="M776 174L780 179L784 174M776 215L780 220L784 215" fill="none" stroke="#475969" stroke-width="1.5"/>
  </g>

  <path d="M772 260H1120" stroke="#2b3948"/>
  <text x="772" y="281" class="mono label muted" style="letter-spacing:1.15px">AI / FULL-STACK / INTERACTIVE SYSTEMS</text>

  <path d="M1146 82H1166V102M746 280V300H766" fill="none" stroke="url(#accent)" stroke-width="1.5" opacity=".85"/>
</svg>
