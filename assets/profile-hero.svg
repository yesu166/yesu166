<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1400 850" role="img" aria-labelledby="title desc">
<title id="title">YESURAJA — yesu166 — B.E. CSE AI &amp; ML</title>
<desc id="desc">A static, GitHub-safe full-width ASCII identity hero for Yesuraja, a second-year Computer Science and Engineering student focused on AI and Machine Learning.</desc>
<defs>
  <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
    <stop offset="0" stop-color="#050912"/>
    <stop offset=".52" stop-color="#0b0717"/>
    <stop offset="1" stop-color="#050b12"/>
  </linearGradient>
  <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#42e8ff"/>
    <stop offset=".24" stop-color="#57a7ff"/>
    <stop offset=".48" stop-color="#a56dff"/>
    <stop offset=".70" stop-color="#ff65c7"/>
    <stop offset=".86" stop-color="#ffa15c"/>
    <stop offset="1" stop-color="#67f0ca"/>
  </linearGradient>
  <linearGradient id="name" x1="0" y1="0" x2="1" y2="0">
    <stop offset="0" stop-color="#42e8ff"/>
    <stop offset=".36" stop-color="#ffffff"/>
    <stop offset=".62" stop-color="#c4a6ff"/>
    <stop offset=".84" stop-color="#ff69c9"/>
    <stop offset="1" stop-color="#67f0ca"/>
  </linearGradient>
  <radialGradient id="aura" cx="50%" cy="46%" r="60%">
    <stop offset="0" stop-color="#4ddfff" stop-opacity=".15"/>
    <stop offset=".42" stop-color="#9a63ff" stop-opacity=".08"/>
    <stop offset="1" stop-color="#ff5dbf" stop-opacity="0"/>
  </radialGradient>
  <pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse">
    <path d="M30 0H0V30" fill="none" stroke="#183042" stroke-width="1" opacity=".30"/>
  </pattern>
  <filter id="glow" x="-18%" y="-18%" width="136%" height="136%">
    <feGaussianBlur stdDeviation="1.35" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <filter id="nameGlow" x="-30%" y="-80%" width="160%" height="260%">
    <feGaussianBlur stdDeviation="4.5" result="blur"/>
    <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
  </filter>
  <style>
    .m{font-family:"DejaVu Sans Mono","Cascadia Mono","Consolas",monospace}
    .micro{font-family:"DejaVu Sans Mono","Cascadia Mono","Consolas",monospace;font-size:11px;letter-spacing:2.4px}
    .a{font-family:"DejaVu Sans Mono","Cascadia Mono","Consolas",monospace;font-size:8.8px;font-weight:600;letter-spacing:.72px;fill:url(#ink);white-space:pre}
    .small{font-family:"DejaVu Sans Mono","Cascadia Mono","Consolas",monospace;font-size:10px;letter-spacing:1.3px;fill:#829cab}
  </style>
</defs>

<rect width="1400" height="850" rx="28" fill="url(#bg)"/>
<rect x="20" y="20" width="1360" height="810" rx="24" fill="url(#grid)"/>
<rect x="20" y="20" width="1360" height="810" rx="24" fill="url(#aura)"/>
<rect x="20" y="20" width="1360" height="810" rx="24" fill="none" stroke="#203847" stroke-width="1.5"/>

<text x="54" y="56" class="micro" fill="#67e6ff">YESURAJA // YESU166 // PERSONAL BUILD MAP</text>
<text x="1346" y="56" text-anchor="end" class="micro" fill="#70efc9">B.E. CSE (AI &amp; ML) // 2ND YEAR</text>

<g filter="url(#nameGlow)">
  <text x="700" y="112" text-anchor="middle" class="m" font-size="54" font-weight="800" letter-spacing="11" fill="url(#name)">YESURAJA</text>
  <text x="700" y="112" text-anchor="middle" class="m" font-size="54" font-weight="800" letter-spacing="11" fill="none" stroke="#ffffff" stroke-width=".55" opacity=".42">YESURAJA</text>
</g>

<line x1="50" y1="138" x2="1350" y2="138" stroke="url(#ink)" stroke-width="1.2" stroke-dasharray="4 19" opacity=".6"/>

