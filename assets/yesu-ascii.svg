<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750" role="img" aria-labelledby="title desc">
  <title id="title">Yesuraja ASCII portrait</title>
  <desc id="desc">A dense monochrome ASCII portrait built from punctuation, symbols, percent signs and at signs.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#05080c"/>
      <stop offset="1" stop-color="#0b1118"/>
    </linearGradient>
    <linearGradient id="ink" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#b5e7ff"/>
      <stop offset="0.55" stop-color="#dff6ff"/>
      <stop offset="1" stop-color="#79c6ff"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.6" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <style>
      .a {
        font-family: "Cascadia Mono","Consolas","SFMono-Regular",monospace;
        font-size: 11px;
        font-weight: 600;
        letter-spacing: 0.55px;
        fill: url(#ink);
        white-space: pre;
      }
      .frame { fill:none; stroke:#243642; stroke-width:1; }
      .micro {
        font-family: "Cascadia Mono","Consolas",monospace;
        font-size: 9px;
        letter-spacing: 2px;
        fill:#7390a0;
      }
    </style>
  </defs>
  <rect width="100%" height="100%" rx="24" fill="url(#bg)"/>
  <rect x="12" y="12" width="1176" height="726" rx="18" class="frame"/>
  <text x="40" y="40" class="micro">YESURAJA // PERSONAL BUILD MAP // ASCII IDENTITY BUFFER</text>
